[package]
name = "qbird"
version = "0.1.3"
edition = "2021"
description = "Local-first LAN chat"
license = "Apache-2.0"

[lib]
name = "qbird_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
sha2 = "=0.11.1"
zeroize = "=1.9.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
mdns-sd = { version = "=0.22.0", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
x509-parser = "=0.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
